common:
  # gamma_config.yaml 中左目发布的是 compressed transport；FAST-LIVO2 订阅解压后的 Image 基础话题。
  img_topic: "/left_camera/image"
  lid_topic: "/livox/lidar"
  imu_topic: "/imu/data"
  img_en: 1
  lidar_en: 1
  ros_driver_bug_fix: false

extrin_calib:
  # T_IMU_LiDAR：p_imu = extrinsic_R * p_lidar + extrinsic_T
  extrinsic_T: [0.049258, -0.012500, 0.026946]
  extrinsic_R: [ 0.999620,  0.027463,  0.002445,
                -0.027517,  0.999299,  0.025398,
                -0.001746, -0.025456,  0.999674]

  # gamma_config.yaml 给出 T_LiDAR_CamL（Camera→LiDAR），这里求逆得到
  # T_CamL_LiDAR：p_cam = Rcl * p_lidar + Pcl。
  Rcl: [ 0.030481734171511, -0.999506201364453, -0.007630027254127,
         0.010470226985452,  0.007952445317845, -0.999913562744470,
         0.999480484166034,  0.030399211296810,  0.010707461125845]
  Pcl: [-0.124309171269376, -0.044253386271011, 0.150907405881620]

time_offset: 
  imu_time_offset: 0.0
  # gamma_config.yaml 未提供传感器时间偏移，先按硬件同步处理。
  img_time_offset: 0.0
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 1
  filter_size_surf: 0.1
  lidar_type: 1 # Livox CustomMsg
  scan_line: 6
  blind: 0.8

vio:
  max_iterations: 5
  outlier_threshold: 1000 # 78 100 156 #100 200 500 700 infinite
  img_point_cov: 100 # 100 1000 
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

imu:
  imu_en: true
  imu_int_frame: 30
  # gamma_config.yaml 给出的是标准差，此处平方后填写方差。
  acc_cov: 0.5
  gyr_cov: 0.3
  b_acc_cov: 1.458943117771223e-08
  b_gyr_cov: 1.184098182394327e-08

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0025 # 0.005
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

local_map:  
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8

uav:
  imu_rate_odom: false
  gravity_align_en: false

publish:
  dense_map_en: true
  pub_effect_point_en: false 
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0

evo:
  seq_name: "Tunnel"
  pose_output_en: true

pcd_save:
  pcd_save_en: false
  type: 0 # 0: World Frame, 1: Body Frame;
  colmap_output_en: false # need to set interval = -1
  filter_size_pcd: 0.15
  interval: -1
  # how many LiDAR frames saved in each pcd file;
  # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

image_save:
  img_save_en: false
  interval: 1

degeneracy:
  # DCReg-ported degeneracy detection + information-domain soft attenuation.
  # See config/avia.yaml for full field documentation. Disabled by default.
  enable: true
  lidar_enable: true
  visual_enable: true
  diagnostic_only: false
  cond_threshold: 10.0
  gate_floor: 0.0
  verbose: true
