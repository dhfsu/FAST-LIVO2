common:
  img_topic: "/camera_1/image_pinhole"
  lid_topic: "/velodyne_points"
  imu_topic: "/imu/data"
  img_en: 1
  lidar_en: 1
  ros_driver_bug_fix: false

extrin_calib:
  # T_imu_laser: laser frame -> IMU frame.
  # Source: /home/zyl/catkin_ws/SubT_MRS_Hawkins_Long_Corridor_RC_Extrinsics.yaml
  extrinsic_T: [0.080000000, 0.029000000, 0.030000000]
  extrinsic_R: [0.999212900, -0.000519121,  0.004000000,
                0.000516111,  0.999218492, -0.000939132,
               -0.004000000,  0.000802565,  0.999993652]

  # T_camera_laser = inverse(T_imu_camera) * T_imu_laser.
  # The rectified pinhole image uses R=I, so its optical frame is unchanged.
  Rcl: [-0.021080936, -0.998777565,  0.021064409,
         0.003616277, -0.020990822, -0.999771971,
         0.998992090, -0.021006651,  0.004059996]
  Pcl: [0.021313588, -0.049438883, -0.099277864]

time_offset:
  lidar_time_offset: 0.0
  imu_time_offset: 0.0
  img_time_offset: 0.0
  exposure_time_init: 0.0

preprocess:
  hilti_en: false
  point_filter_num: 2
  filter_size_surf: 0.1
  lidar_type: 2  # VELO16; input type is sensor_msgs/PointCloud2
  scan_line: 16
  blind: 0.5

vio:
  max_iterations: 5
  outlier_threshold: 1000
  img_point_cov: 100
  patch_size: 8
  patch_pyrimid_level: 3
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.5
  gyr_cov: 0.3
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0025
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

local_map:
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8

uav:
  imu_rate_odom: false
  gravity_align_en: false

publish:
  dense_map_en: true
  pub_effect_point_en: false
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0

evo:
  seq_name: "SubT_MRS_Hawkins_Long_Corridor"
  pose_output_en: true

pcd_save:
  pcd_save_en: false
  type: 0
  colmap_output_en: false
  filter_size_pcd: 0.15
  interval: -1

image_save:
  img_save_en: false
  interval: 1

# ===== 退化识别(只检测、发布话题,不改变状态估计) =====
# 打开后会在 LIO/VIO 每帧更新后分析 6x6 姿态信息矩阵,并发布:
#   /degeneracy/lidar 、 /degeneracy/vio  (std_msgs/Float32MultiArray)
# 长走廊/隧道场景建议先用本块观察 cond_trans 与 normal_scatter_min 再标定阈值。
degeneracy:
  enable: true            # 总开关,默认关闭时零开销、不影响原行为
  cond_thresh: 300.0      # 条件数阈值:标定自 t=103.8s 失效事件,健康误报4.2%/失效前检出92%(原100→误报9.9%)
  hysteresis_on: 3        # 连续 N 帧判退化才置位(去抖)
  hysteresis_off: 3       # 连续 N 帧良态才复位
  lidar:
    lambda_floor_rot: 1.0e-3      # 旋转信息最强特征值下限(LiDAR 量级很大,仅作近零保护)
    lambda_floor_trans: 1.0e-3    # 平移信息最强特征值下限
    normal_scatter_thresh: 0.005  # 标定值:健康误报4.0%/失效前检出96.2%(原0.02→误报28.9%,过灵敏)
  vio:
    lambda_floor_rot: 1.0e-6      # 设为极小值使绝对下限失效(VIO光度信息尺度任意、不可迁移);盲检测改用点数
    lambda_floor_trans: 1.0e-6
    adaptive_alpha: 0.3           # total_points < 0.3*运行中位 -> 判VIO整体弱/盲(自标定、尺度无关)
    min_points: 15                # 热身/绝对兜底点数下限
  # 退化处理:解空间投影。开启后在退化置位时把不可观方向从位姿增量投影掉,退回IMU预测。
  # 验收目标:阻止 t≈103.8s 的走廊退化发散。
  handling:
    enable: true
    remap_ratio: 100.0            # eval_max/eval_k 超过此值的方向判为不可观并投影掉
