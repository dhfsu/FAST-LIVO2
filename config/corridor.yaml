common:
  img_topic: "/camera/color/image_decompressed"
  lid_topic: "/livox/avia/lidar"
  imu_topic: "/livox/avia/imu"
  img_en: 1
  lidar_en: 1
  ros_driver_bug_fix: false

extrin_calib:
  extrinsic_T: [0.04165, 0.02326, -0.0284]
  extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]

  # Rcl/Pcl = T_camera<-lidar (FAST-LIVO2 用 p_cam = Rcl*p_lidar + Pcl)。
  # 原始配置给的是逆变换(T_lidar<-camera),导致点云投影全部落到画面外、VIO 无法建视觉地图。
  # 此处已改为其逆:Rcl_new = Rcl_old^T, Pcl_new = -Rcl_old^T * Pcl_old(点云入图率 0%->57%)。
  Rcl: [0.02107670, -0.99939690, -0.02759650,
        -0.00387170,  0.02752090, -0.99961370,
        0.99977030,  0.02117540, -0.00328940]
  Pcl: [0.01784478, 0.08945892, 0.16155588]

time_offset: 
  imu_time_offset: 0.0
  img_time_offset: 0.1
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 1
  filter_size_surf: 0.1
  lidar_type: 1 # Livox Avia LiDAR
  scan_line: 6
  blind: 0.8

vio:
  max_iterations: 5
  outlier_threshold: 1000 # 78 100 156 #100 200 500 700 infinite
  img_point_cov: 100 # 100 1000 
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: true
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.5 # 0.2
  gyr_cov: 0.3 # 0.5
  # acc_cov: 0.08691302 # 0.2
  # gyr_cov: 0.00207299 # 0.5
  b_acc_cov: 0.0001 # 0.1
  b_gyr_cov: 0.0001 # 0.1

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0025 # 0.005
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

local_map:  
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8

uav:
  imu_rate_odom: false
  gravity_align_en: false

publish:
  dense_map_en: true
  pub_effect_point_en: false 
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0

evo:
  seq_name: "Corridor_01"
  pose_output_en: true

pcd_save:
  pcd_save_en: false
  type: 0 # 0: World Frame, 1: Body Frame;
  colmap_output_en: false # need to set interval = -1
  filter_size_pcd: 0.15
  interval: -1
  # how many LiDAR frames saved in each pcd file;
  # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

image_save:
  img_save_en: false
  interval: 1

degeneracy:
  # DCReg-ported degeneracy detection + information-domain soft attenuation.
  # See config/avia.yaml for full field documentation. Disabled by default.
  enable: true
  lidar_enable: true
  visual_enable: true
  diagnostic_only: false
  cond_threshold: 10.0
  gate_floor: 0.0
  verbose: true
