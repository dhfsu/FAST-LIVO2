common:
  img_topic: "/camera/color/image_decompressed"
  lid_topic: "/livox/avia/lidar"
  imu_topic: "/livox/avia/imu"
  img_en: 1
  lidar_en: 1
  ros_driver_bug_fix: false

extrin_calib:
  extrinsic_T: [0.04165, 0.02326, -0.0284]
  extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]

  # Rcl/Pcl = T_camera<-lidar (FAST-LIVO2 用 p_cam = Rcl*p_lidar + Pcl)。
  # 原始配置给的是逆变换(T_lidar<-camera),导致点云投影全部落到画面外、VIO 无法建视觉地图。
  # 此处已改为其逆:Rcl_new = Rcl_old^T, Pcl_new = -Rcl_old^T * Pcl_old(点云入图率 0%->57%)。
  Rcl: [0.02107670, -0.99939690, -0.02759650,
        -0.00387170,  0.02752090, -0.99961370,
        0.99977030,  0.02117540, -0.00328940]
  Pcl: [0.01784478, 0.08945892, 0.16155588]

time_offset: 
  imu_time_offset: 0.0
  img_time_offset: 0.1
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 1
  filter_size_surf: 0.1
  lidar_type: 1 # Livox Avia LiDAR
  scan_line: 6
  blind: 0.8

vio:
  max_iterations: 5
  outlier_threshold: 1000 # 78 100 156 #100 200 500 700 infinite
  img_point_cov: 100 # 100 1000 
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

imu:
  imu_en: true
  imu_int_frame: 30
  # acc_cov: 0.5 # 0.2
  # gyr_cov: 0.3 # 0.5
  acc_cov: 0.5   # FAST-LIVO2 ESIKF 调好的过程噪声(所有可用配置都用此值)
  gyr_cov: 0.3
  # 用户标定的原始噪声密度(过小,滤波器过度信任IMU预测->拒绝LiDAR校正->发散,勿直接用):
  # acc_cov: 0.08691302
  # gyr_cov: 0.00207299
  b_acc_cov: 0.0001 # 0.1
  b_gyr_cov: 0.0001 # 0.1

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0025 # 0.005
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

local_map:  
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8

uav:
  imu_rate_odom: false
  gravity_align_en: false

publish:
  dense_map_en: true
  pub_effect_point_en: false 
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0

evo:
  seq_name: "Corridor_01"
  pose_output_en: true

pcd_save:
  pcd_save_en: false
  type: 0 # 0: World Frame, 1: Body Frame;
  colmap_output_en: false # need to set interval = -1
  filter_size_pcd: 0.15
  interval: -1
  # how many LiDAR frames saved in each pcd file;
  # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

image_save:
  img_save_en: false
  interval: 1

# ===== 退化识别(只检测、发布话题) =====
# 已按本数据集(Livox Avia)标定:走廊段(t≈40-60/150-173/390-403s)沿走廊轴(世界X)
# 平移退化,scatter降到0.003-0.02、cond升到40-280;房间/路口段 scatter>0.05、cond<10。
# Avia竖直覆盖比Velodyne密,整体scatter偏高,故阈值高于SubT(0.005)。
degeneracy:
  enable: true
  cond_thresh: 100.0            # 走廊段cond达40-280,房间段<10;健康p95≈87
  hysteresis_on: 3
  hysteresis_off: 3
  lidar:
    lambda_floor_rot: 1.0e-3
    lambda_floor_trans: 1.0e-3
    normal_scatter_thresh: 0.02  # warm-up 兜底绝对阈值(自适应模式下仅热身期用)
  vio:
    lambda_floor_rot: 1.0e-6      # 设为极小值使绝对下限失效(VIO光度信息尺度任意、不可迁移);盲检测改用点数
    lambda_floor_trans: 1.0e-6
    adaptive_alpha: 0.3           # total_points < 0.3*运行中位 -> 判VIO整体弱/盲(自标定、尺度无关)
    min_points: 15                # 热身/绝对兜底点数下限
  # 自适应相对阈值:scatter 判据改用"低于运行中位数的 alpha 倍"(与传感器无关,一次设定跨数据集通用)
  adaptive:
    enable: true
    alpha: 0.15        # 阈值 = alpha * 运行中位数(实测两 LiDAR 手调值均≈0.15-0.18×中位)
    window: 300        # 滚动窗口帧数
    min_samples: 50    # 热身:样本不足时退回上面的绝对 normal_scatter_thresh
  # 退化处理:解空间投影(退化置位时把不可观方向从位姿增量投影掉,退回IMU预测)
  handling:
    enable: true
    remap_ratio: 100.0
    cov_consistency: true   # 退化方向不缩协方差(方向2),保持诚实不确定性以便重定位
